<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090714">
<title>LVH — Neon Stage</title>
<style>
:root{color-scheme:dark;--pink:#ff4fc8;--cyan:#4eeaff;--violet:#9d5cff}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100vh;min-height:100svh;overflow:hidden;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse at 50% 48%,#21103d 0,#100a20 43%,#070611 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
/* Nền ánh sáng sân khấu */
.stage{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(125,47,215,.22),transparent 52%),linear-gradient(115deg,transparent 35%,rgba(76,222,255,.06) 50%,transparent 65%)}
.stage:before,.stage:after{content:"";position:absolute;left:50%;top:50%;width:min(130vw,1500px);aspect-ratio:1;border:1px solid rgba(126,213,255,.11);border-radius:50%;transform:translate(-50%,-50%) rotate(-18deg);box-shadow:0 0 0 44px rgba(111,76,255,.025),0 0 0 100px rgba(255,79,200,.022),inset 0 0 70px rgba(75,210,255,.045);animation:ring 18s linear infinite}
.stage:after{width:min(105vw,1160px);border-color:rgba(255,89,207,.16);transform:translate(-50%,-50%) rotate(28deg);animation-direction:reverse;animation-duration:25s}
.beam{position:absolute;top:-35%;height:170%;width:18vw;filter:blur(38px);opacity:.18;transform-origin:top;animation:beam 8s ease-in-out infinite alternate}
.beam.one{left:8%;background:linear-gradient(180deg,transparent,var(--pink),transparent);transform:rotate(24deg)}
.beam.two{right:9%;background:linear-gradient(180deg,transparent,var(--cyan),transparent);transform:rotate(-24deg);animation-delay:-4s}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#71edff 1px,transparent 1.5px),radial-gradient(#ff6bd4 1px,transparent 1.5px);background-size:97px 97px,157px 157px,223px 223px;background-position:0 0,42px 61px,88px 22px;opacity:.28;animation:drift 28s linear infinite}
/* Ảnh được giữ nguyên tỷ lệ, nằm chính giữa */
.center{position:relative;z-index:2;width:min(88vw,1100px);animation:arrive 1.1s cubic-bezier(.2,.8,.2,1) both}
.photo-wrap{position:relative;padding:clamp(5px,.8vw,10px);border:1px solid rgba(255,255,255,.7);border-radius:clamp(10px,1.5vw,20px);background:linear-gradient(130deg,rgba(255,255,255,.22),rgba(255,255,255,.025) 35%,rgba(117,225,255,.18) 68%,rgba(255,83,205,.26));box-shadow:0 0 0 1px rgba(255,255,255,.12),0 28px 100px rgba(0,0,0,.65),0 0 48px rgba(145,65,255,.42),0 0 100px rgba(75,202,255,.16);animation:float 6s ease-in-out infinite}
.photo-wrap:before{content:"";position:absolute;inset:-2px;border-radius:inherit;background:linear-gradient(110deg,var(--pink),transparent 27%,var(--cyan) 54%,transparent 75%,var(--pink));z-index:-1;filter:blur(12px);opacity:.6;animation:glow 5s ease-in-out infinite alternate}
.photo{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;border-radius:clamp(6px,1vw,12px)}
/* Chấm sáng trang trí */
.spark{position:fixed;z-index:1;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px var(--cyan);animation:twinkle 2.5s ease-in-out infinite}
.s1{left:12%;top:23%}.s2{right:14%;top:29%;background:#ffb1e7;box-shadow:0 0 14px 4px var(--pink);animation-delay:-1s}.s3{left:20%;bottom:19%;animation-delay:-.6s}.s4{right:21%;bottom:17%;background:#d6c0ff;box-shadow:0 0 14px 4px var(--violet);animation-delay:-1.7s}
.corner{position:fixed;z-index:2;top:24px;left:28px;display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.64);font-size:10px;font-weight:750;letter-spacing:.23em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink);animation:twinkle 1.5s infinite}
.error{display:none;position:fixed;z-index:3;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 15px;border:1px solid #ff76cf66;border-radius:10px;background:#150d25;color:#fff;font-size:13px}
body.no-image .error{display:block}
@keyframes ring{to{transform:translate(-50%,-50%) rotate(342deg)}}
@keyframes beam{to{opacity:.32;filter:blur(50px)}}
@keyframes drift{to{background-position:97px 97px, -115px 218px, 311px -201px}}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.006)}}
@keyframes glow{to{opacity:.95;filter:blur(18px)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes arrive{from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@media(max-width:600px){.center{width:94vw}.photo{max-height:70vh}.corner{top:15px;left:16px;font-size:8px}.spark{width:5px;height:5px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="stage" aria-hidden="true"><div class="stars"></div><div class="beam one"></div><div class="beam two"></div></div>

<div class="spark s1" aria-hidden="true"></div><div class="spark s2" aria-hidden="true"></div><div class="spark s3" aria-hidden="true"></div><div class="spark s4" aria-hidden="true"></div>
<main class="center"><div class="photo-wrap"><img class="photo" src="1.png" alt="Ảnh LVH ở giữa nền sân khấu neon" onerror="document.body.classList.add('no-image')"></div></main>
<div class="error">Không thấy <b>1.png</b> — hãy để ảnh cùng thư mục với index.html.</div>
</body>
</html>
